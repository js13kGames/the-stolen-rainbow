<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111321"><title>The Stolen Rainbow</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c0f1c;color:#eee8db;font:14px system-ui;overflow:hidden}#shell{container-type:inline-size;position:relative;width:min(100vw,133.333vh);height:min(75vw,100vh);margin:auto;top:50vh;transform:translateY(-50%)}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(90deg,#11132388,transparent,#11132388);text-align:center}h1{font:clamp(16px,min(7vw,10vh),76px)/.96 monospace;font-weight:normal;letter-spacing:2px;margin:clamp(6px,2vh,22px) 0;color:#f6ebcf;text-shadow:0 3px #211c31}h1 em{font-size:.55em;font-style:italic;color:#b69ee5}#menu p{font-size:clamp(8px,min(1.6vw,2.6vh),16px);line-height:1.8;color:#bdbcca;margin:4px 14px}button{font:inherit;color:#f4e8cc;border:1px solid #aa9472;background:#242334;padding:clamp(5px,1.5vh,11px) 16px;cursor:pointer;letter-spacing:2px;margin:clamp(6px,2vh,22px) 8px 10px}button:hover,button:focus{background:#40304e;outline:1px solid #dfc68e;outline-offset:4px}#tools{position:absolute;right:2%;bottom:2%;width:16%;height:8%;display:flex;flex-direction:column;gap:2px}#tools button{flex:1;min-height:0;font-size:1.5cqw;padding:0;margin:0;background:#171a27;opacity:.8;letter-spacing:0}#menu[hidden]{display:none}#pause{position:absolute;inset:0;background:#0b0e1ddb;display:none;align-items:center;justify-content:center;flex-direction:column}#pause.on{display:flex}#pause h2{font:24px monospace}a{color:#e9d4a8}@media(max-height:450px){h1{margin:10px}button{margin:8px}#menu p{font-size:10px}}
:fullscreen #shell{position:absolute;width:min(100vw,133.333vh);height:min(75vw,100vh);top:50%;left:50%;margin:0;transform:translate(-50%,-50%)}
</style>
<div id="shell"><canvas id="screen" width="320" height="240" aria-label="The Stolen Rainbow: arrows move, Z shoots, X bombs, C or 1/2/3 switches colour, Escape pauses"></canvas><div id="menu"><h1>THE STOLEN<br><em>RAINBOW</em></h1><button id="start">START / ENTER</button><p>Find the seven lost elements.<br>Bring the rainbow back.</p></div><div id="pause"><h2>PAUSED</h2><p>ESC / P to return · Q to title</p><button id="resume">RESUME</button></div><div id="tools"><button id="sound" aria-label="Toggle sound effects">SFX ON</button><button id="full">FULLSCREEN</button></div></div>
<script src="game.js"></script></html>
